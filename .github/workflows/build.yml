name: Pobierz i opublikuj

on:
  schedule:
    - cron: "17 4 * * *"   # codziennie ok. 5:17/6:17 czasu polskiego (UTC)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # zawsze najnowszy stan gałęzi, nie commit, który wywołał przebieg

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testy
        run: python -m unittest discover -s tests -v

      - name: Pobierz źródła
        run: python -m gn.fetch

      - name: Zapisz dane w repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: aktualizacja $(date -u +%F)"
          # W międzyczasie mógł dojść commit z panelu redakcji lub z poprzedniego przebiegu.
          # Przy konflikcie w data/ wygrywają dane z tego przebiegu (pliki są generowane).
          git pull --rebase -X theirs
          git push

      - name: Zbuduj stronę
        run: python -m gn.build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
